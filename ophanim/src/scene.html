<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
<script type="module">
/**
 * Rings-only 3D layer. The photoreal eye stays in the poster and is animated in 2D.
 * Textures are sampled from the dark artwork. 10s seamless world-axis spins.
 */
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const W = parseInt(params.get('w') || '1920', 10);
const H = parseInt(params.get('h') || '1080', 10);
const VARIANT = params.get('variant') || 'computador';
const DURATION = 10;
const FPS = 24;

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  preserveDrawingBuffer: true,
  powerPreference: 'low-power',
});
renderer.setClearColor(0x000000, 0);
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);
camera.position.set(0, 0, 5.35);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0x3a1408, 0.7));
const key = new THREE.DirectionalLight(0xff6633, 1.5);
key.position.set(-2.2, 2.6, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xff2200, 0.45);
fill.position.set(2, -2, -1);
scene.add(fill);
const core = new THREE.PointLight(0xffaa66, 0.9, 5, 2);
core.position.set(0, 0, 0.2);
scene.add(core);

const texLoader = new THREE.TextureLoader();
const loadTex = (url) =>
  new Promise((res, rej) => texLoader.load(url, res, undefined, rej));

let ringTex;
try {
  ringTex = await loadTex(`/textures/ring_eyes_${VARIANT}.png`);
} catch {
  ringTex = await loadTex('/textures/ring_eyes.png');
}
ringTex.colorSpace = THREE.SRGBColorSpace;
ringTex.wrapS = ringTex.wrapT = THREE.RepeatWrapping;
ringTex.repeat.set(2.2, 1);

function ringMat() {
  return new THREE.MeshStandardMaterial({
    map: ringTex,
    roughness: 0.55,
    metalness: 0.35,
    emissive: new THREE.Color(0x2a0800),
    emissiveIntensity: 0.4,
    color: new THREE.Color(0xeebb99),
  });
}

function makeRing(major, minor, rot, turns, axis) {
  const mesh = new THREE.Mesh(
    new THREE.TorusGeometry(major, minor, 64, 220),
    ringMat()
  );
  mesh.rotation.set(rot[0], rot[1], rot[2]);
  const worldAxis =
    axis === 'x' ? new THREE.Vector3(1, 0, 0) :
    axis === 'y' ? new THREE.Vector3(0, 1, 0) :
                   new THREE.Vector3(0, 0, 1);
  mesh.userData = { turns, worldAxis, baseQuat: mesh.quaternion.clone() };
  scene.add(mesh);
  return mesh;
}

// Nested cage — leave a clear hole for the poster's real eye
const rings = [
  makeRing(1.02, 0.13, [0.6, 0.12, 0.9], 1, 'x'),
  makeRing(1.16, 0.12, [1.48, 0.22, 0.08], -1, 'y'),
  makeRing(1.30, 0.11, [0.3, 1.2, 0.5], 1, 'z'),
  makeRing(1.44, 0.10, [1.1, 0.5, 1.1], -1, 'x'),
];

function setTime(t) {
  const q = new THREE.Quaternion();
  for (const mesh of rings) {
    const { turns, worldAxis, baseQuat } = mesh.userData;
    q.setFromAxisAngle(worldAxis, 2 * Math.PI * turns * t);
    mesh.quaternion.copy(q).multiply(baseQuat);
  }
  renderer.render(scene, camera);
}

window.renderFrame = function (frameIndex) {
  setTime(frameIndex / (DURATION * FPS));
  return renderer.domElement.toDataURL('image/png');
};
window.renderAt = (tSec) =>
  setTime((((tSec % DURATION) + DURATION) % DURATION) / DURATION);

setTime(0);
document.title = 'READY';
window.__READY__ = true;
</script>
</body>
</html>
